<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t"><title id="t">Single Joystick Remote Controller illustrated operation steps</title><rect width="1200" height="760" rx="28" fill="#f3f6f8"/><style>.p{fill:#fff;stroke:#24577a;stroke-width:3}.n{fill:#ec7a20}.nt{font:700 24px Arial;fill:#fff}.h{font:700 21px Arial;fill:#153247}.s{font:16px Arial;fill:#405665}.ok{fill:#e5f5eb;stroke:#268653;stroke-width:2}.scr{fill:#10212a;stroke:#333;stroke-width:2}.st{font:15px monospace;fill:#9fffb5}</style>
<text class="h" x="45" y="42">Single Joystick Remote Controller — match each picture to the numbered instruction</text>
<g transform="translate(35 70)"><rect class="p" width="355" height="200" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">1</text><text class="h" x="62" y="37">Inspect and connect</text><path d="M90 95h90v75H90z" fill="#cbd7de" stroke="#24577a" stroke-width="3"/><path d="M135 95V55" stroke="#24577a" stroke-width="6"/><circle cx="135" cy="135" r="22" fill="#eee" stroke="#24577a" stroke-width="3"/><text class="s" x="205" y="90">Antenna fitted</text><text class="s" x="205" y="120">Stick centered</text><text class="s" x="205" y="150">No damage</text></g>
<g transform="translate(423 70)"><rect class="p" width="355" height="200" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">2</text><text class="h" x="62" y="37">Power on in Hold</text><rect class="scr" x="65" y="75" width="220" height="90" rx="8"/><text class="st" x="95" y="112">ROBOT LOST</text><text class="st" x="95" y="145">MODE: HOLD</text></g>
<g transform="translate(811 70)"><rect class="p" width="355" height="200" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">3</text><text class="h" x="62" y="37">Wait for connection</text><rect class="scr" x="65" y="75" width="220" height="90" rx="8"/><text class="st" x="95" y="110">ROBOT OK</text><text class="st" x="95" y="140">RSSI -65 dBm</text><path d="M300 145q18-35 36 0m-27-15q9-17 18 0" fill="none" stroke="#268653" stroke-width="5"/></g>
<g transform="translate(35 300)"><rect class="p" width="355" height="200" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">4</text><text class="h" x="62" y="37">Select Manual</text><circle cx="95" cy="120" r="34" fill="#eef3f6" stroke="#24577a" stroke-width="3"/><text class="s" x="88" y="126">B1</text><path d="M145 120h55" stroke="#ec7a20" stroke-width="5"/><rect class="ok" x="210" y="90" width="115" height="60" rx="10"/><text class="h" x="224" y="128">MANUAL</text></g>
<g transform="translate(423 300)"><rect class="p" width="355" height="200" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">5</text><text class="h" x="62" y="37">Test directions slowly</text><circle cx="175" cy="125" r="50" fill="#eaf0f4" stroke="#24577a" stroke-width="3"/><circle cx="175" cy="125" r="15" fill="#ec7a20"/><path d="M175 68v27m0 60v25M78 125h67m60 0h72" stroke="#24577a" stroke-width="5"/><text class="s" x="175" y="62" text-anchor="middle">Forward</text><text class="s" x="175" y="196" text-anchor="middle">Reverse</text><text class="s" x="52" y="131" text-anchor="middle">Left</text><text class="s" x="301" y="131" text-anchor="middle">Right</text></g>
<g transform="translate(811 300)"><rect class="p" width="355" height="200" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">6</text><text class="h" x="62" y="37">Stop and select Hold</text><circle cx="105" cy="120" r="34" fill="#eef3f6" stroke="#24577a" stroke-width="3"/><text class="s" x="98" y="126">B1</text><rect class="ok" x="180" y="90" width="120" height="60" rx="10"/><text class="h" x="202" y="128">HOLD</text></g>
<g transform="translate(35 530)"><rect class="p" width="550" height="190" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">7</text><text class="h" x="62" y="37">Open Wi-Fi settings when needed</text><g fill="none" stroke="#24577a" stroke-width="7" stroke-linecap="round"><path d="M65 100Q125 45 185 100"/><path d="M85 125Q125 88 165 125"/><path d="M106 148Q125 130 144 148"/></g><circle cx="125" cy="163" r="7" fill="#24577a"/><text class="s" x="205" y="90">Network: mars_rc_XXXXXX</text><text class="s" x="205" y="120">Password: alphaagtech</text><text class="s" x="205" y="150">Open: 192.168.10.1</text></g>
<g transform="translate(615 530)"><rect class="p" width="550" height="190" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">8</text><text class="h" x="62" y="37">Emergency: use physical E-stop</text><circle cx="145" cy="125" r="55" fill="#d9272e" stroke="#821017" stroke-width="7"/><text x="105" y="132" font-family="Arial" font-size="20" font-weight="700" fill="#fff">E-STOP</text><text class="s" x="230" y="105">Release the joystick</text><text class="s" x="230" y="135">Press robot E-stop</text><text class="s" x="230" y="165">Do not approach moving robot</text></g></svg>
