  <title
     id="title">Power hub 12 volt and 5 volt port map</title>
  <desc
     id="desc">The power hub has six 12 volt CAN ports, four 5 volt CAN ports, two 12 volt power-only ports and two 5 volt power-only ports. The GPS rover and UVC relay receive CAN and 5 volt power from 5 volt CAN ports. The navigation controller uses a 5 volt CAN port for CAN and ground but receives operating power over PoE.</desc>
