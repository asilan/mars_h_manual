<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
<title id="t">Dual Joystick Remote Controller UV-C activation warning</title><desc id="d">Confirmation screen requiring SW3 to turn on all UV-C lights or SW4 to cancel.</desc>
<rect width="800" height="600" rx="28" fill="#34383b"/><rect x="25" y="25" width="750" height="550" fill="#fff" stroke="#111" stroke-width="5"/><rect x="25" y="25" width="750" height="76" fill="#111"/><text x="50" y="74" fill="#fff" font-family="Arial" font-size="34" font-weight="700">UV-C ACTIVATION WARNING</text><rect x="62" y="130" width="676" height="350" rx="14" fill="#fff" stroke="#111" stroke-width="8"/><g fill="#111" font-family="Arial" text-anchor="middle"><text x="400" y="190" font-size="35" font-weight="700">DANGER — UV-C RADIATION</text><text x="400" y="250" font-size="29">Can injure eyes and skin.</text><text x="400" y="320" font-size="27">Confirm the area is empty, secured,</text><text x="400" y="358" font-size="27">and all interlocks are active.</text><text x="400" y="430" font-size="28" font-weight="700">SW3: TURN ON     SW4: CANCEL</text></g><rect x="25" y="525" width="750" height="50" fill="#fff" stroke="#111" stroke-width="2"/><text x="90" y="559" fill="#111" font-family="Arial" font-size="23" font-weight="700">SW3: TURN ON                    SW4: CANCEL</text>
</svg>
