  <title
     id="title">Navigation controller Wi-Fi and SSH field-technician access</title>
  <desc
     id="desc">Six illustrated steps: make the robot safe, join the navigation controller access point, use mars.local, connect as user mars by SSH, inspect services without changing them, and exit.</desc>
  <rect
     width="1200"
     height="690"
     rx="28"
     fill="#eef3f6"
     id="rect1" />
