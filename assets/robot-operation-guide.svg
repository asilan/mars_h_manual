<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t"><title id="t">Robot and UVC illustrated operation guide</title><rect width="1200" height="680" rx="28" fill="#f3f6f8"/><style>.p{fill:#fff;stroke:#24577a;stroke-width:3}.n{fill:#ec7a20}.nt{font:700 23px Arial;fill:white}.h{font:700 19px Arial;fill:#153247}.s{font:15px Arial;fill:#405665}.r{fill:#dbe4e9;stroke:#24577a;stroke-width:3}.g{fill:#dff4e7;stroke:#268653;stroke-width:2}.d{fill:#ffe1df;stroke:#d9272e;stroke-width:2}</style><text class="h" x="45" y="40">Robot and four-lamp UVC system — numbered operator guide</text>
<g transform="translate(30 65)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">1</text><text class="h" x="58" y="35">Inspect robot</text><rect class="r" x="55" y="95" width="160" height="75" rx="12"/><circle cx="80" cy="185" r="22" fill="#333"/><circle cx="190" cy="185" r="22" fill="#333"/><path d="M75 90V55m120 35V55" stroke="#24577a" stroke-width="5"/><text class="s" x="48" y="235">Wheels · wiring · antennas</text></g>
<g transform="translate(320 65)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">2</text><text class="h" x="58" y="35">Power in Hold</text><rect class="g" x="55" y="85" width="160" height="70" rx="10"/><text class="h" x="105" y="127">HOLD</text><text class="s" x="55" y="195">UVC: DISARMED</text><text class="s" x="55" y="225">All motor commands: 0</text></g>
<g transform="translate(610 65)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">3</text><text class="h" x="58" y="35">Check dashboard</text><rect x="45" y="75" width="180" height="125" rx="8" fill="#eef3f6" stroke="#24577a" stroke-width="3"/><text class="s" x="65" y="108">Motors: 4 OK</text><text class="s" x="65" y="138">CAN: ONLINE</text><text class="s" x="65" y="168">Battery: GOOD</text><text class="s" x="65" y="228">No faults · no E-stop</text></g>
<g transform="translate(900 65)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">4</text><text class="h" x="58" y="35">Direction test</text><rect class="r" x="55" y="90" width="160" height="70" rx="12"/><path d="M135 175v50m0-50-18 22m18-22 18 22" fill="none" stroke="#ec7a20" stroke-width="6"/><text class="s" x="70" y="245">Use low speed only</text></g>
<g transform="translate(30 355)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">5</text><text class="h" x="58" y="35">Secure UVC area</text><path d="M45 190h180M65 190V80m140 110V80" stroke="#d9272e" stroke-width="6"/><path d="M65 80h140" stroke="#d9272e" stroke-width="6" stroke-dasharray="12 8"/><text x="92" y="125" font="700 20px Arial" fill="#d9272e">NO ENTRY</text><text class="s" x="55" y="230">People out · interlocks tested</text></g>
<g transform="translate(320 355)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">6</text><text class="h" x="58" y="35">Arm then turn on</text><rect class="g" x="45" y="85" width="80" height="55" rx="8"/><text class="s" x="65" y="118">ARM</text><path d="M135 112h35" stroke="#ec7a20" stroke-width="5"/><rect class="d" x="180" y="85" width="55" height="55" rx="8"/><text class="s" x="193" y="118">ON</text><text class="s" x="48" y="180">Confirm warning deliberately</text><text class="s" x="48" y="215">Verify Group A/B feedback</text></g>
<g transform="translate(610 355)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">7</text><text class="h" x="58" y="35">Monitor treatment</text><g transform="translate(65 85)"><circle class="g" cx="25" cy="25" r="20"/><circle class="g" cx="80" cy="25" r="20"/><circle class="g" cx="25" cy="80" r="20"/><circle class="g" cx="80" cy="80" r="20"/></g><text class="s" x="45" y="205">Four lamps · two groups</text><text class="s" x="45" y="235">Keep exclusion zone secure</text></g>
<g transform="translate(900 355)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">8</text><text class="h" x="58" y="35">All Off and Disarm</text><rect class="d" x="45" y="85" width="85" height="60" rx="8"/><text class="s" x="59" y="120">ALL OFF</text><rect class="g" x="145" y="85" width="90" height="60" rx="8"/><text class="s" x="156" y="120">DISARM</text><text class="s" x="48" y="190">Verify six channels OFF</text><text class="s" x="48" y="220">Use physical disconnect</text></g></svg>
