<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d">
<title id="t">All Single Joystick Remote Controller OLED pages</title><desc id="d">Home, Telemetry, Settings, and Joystick Calibration screens.</desc>
<rect width="1000" height="760" fill="#e9eef1"/>
<defs><style>.case{fill:#252a2e}.screen{fill:#061b22;stroke:#738892;stroke-width:3}.txt{fill:#d8fbff;font:19px Consolas,monospace}.cap{fill:#17202a;font:700 21px Arial,sans-serif}</style></defs>
<g transform="translate(30 25)"><text class="cap" x="0" y="0">Home</text><rect class="case" y="14" width="455" height="325" rx="22"/><rect class="screen" x="24" y="39" width="407" height="275" rx="7"/><g class="txt"><text x="40" y="70">[1/4] HOME</text><text x="40" y="103">ROBOT OK</text><text x="40" y="136">ROBOT PWR 82%</text><text x="40" y="169">RC 4.08V RSSI -67dBm</text><text x="40" y="202">MODE HOLD</text><text x="40" y="235">CMD L+0.00 T+0.00</text><text x="40" y="268">ACT L+0.00 T+0.00</text></g></g>
<g transform="translate(515 25)"><text class="cap" x="0" y="0">Telemetry</text><rect class="case" y="14" width="455" height="325" rx="22"/><rect class="screen" x="24" y="39" width="407" height="275" rx="7"/><g class="txt"><text x="40" y="70">[2/4] TELEMETRY</text><text x="40" y="103">LINK OK STATUS 0x01</text><text x="40" y="136">GPS 3D AGE 0s</text><text x="40" y="169">LAT 29.643210</text><text x="40" y="202">LON -82.354110</text><text x="40" y="235">ALT 31.4m</text><text x="40" y="268">RSSI -67dBm</text></g></g>
<g transform="translate(30 400)"><text class="cap" x="0" y="0">Settings</text><rect class="case" y="14" width="455" height="325" rx="22"/><rect class="screen" x="24" y="39" width="407" height="275" rx="7"/><g class="txt"><text x="40" y="70">[3/4] SETTINGS</text><text x="40" y="103">&gt; FREQ 915 MHz</text><text x="40" y="136">  BW   500 kHz</text><text x="40" y="169">  SF   7</text><text x="40" y="202">  DEAD 0.05</text><text x="40" y="235">  LOW L/T 0.5/0.5</text><text x="40" y="268">  HIGH L/T 1.5/1.5</text></g></g>
<g transform="translate(515 400)"><text class="cap" x="0" y="0">Joystick Calibration</text><rect class="case" y="14" width="455" height="325" rx="22"/><rect class="screen" x="24" y="39" width="407" height="275" rx="7"/><g class="txt"><text x="40" y="70">[4/4] CALIBRATION</text><text x="40" y="108">MOVE FULL RANGE</text><text x="40" y="145">X MIN 312  MAX 3786</text><text x="40" y="178">Y MIN 298  MAX 3801</text><text x="40" y="215">RELEASE TO CENTER</text><text x="40" y="260">B2: FINISH</text></g></g>
