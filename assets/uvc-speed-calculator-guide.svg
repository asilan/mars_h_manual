<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t"><title id="t">Three-step UVC robot speed calculator guide</title><rect width="1200" height="390" rx="28" fill="#f3f6f8"/><style>.p{fill:#fff;stroke:#24577a;stroke-width:3}.n{fill:#e87318}.nt{font:700 23px Arial;fill:#fff}.h{font:700 20px Arial;fill:#153247}.s{font:16px Arial;fill:#405665}.g{fill:#e5f5eb;stroke:#268653;stroke-width:3}</style><text class="h" x="45" y="40">UVC speed calculator — estimate, measure, then validate</text>
<g transform="translate(35 70)"><rect class="p" width="350" height="270" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">1</text><text class="h" x="65" y="38">Enter real geometry</text><text class="s" x="55" y="95">• target plant dose</text><text class="s" x="55" y="125">• active lamps / relay group</text><text class="s" x="55" y="155">• plant distance</text><text class="s" x="55" y="185">• UV output and aging</text><text class="s" x="55" y="215">• exposure length</text><text class="s" x="55" y="245">• measured utilization factor</text></g>
<g transform="translate(425 70)"><rect class="p" width="350" height="270" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">2</text><text class="h" x="65" y="38">Calculate estimate</text><text class="s" x="55" y="100">I = N × P × age × U ÷ (4πr²)</text><text class="s" x="55" y="140">time = target dose ÷ I</text><text class="s" x="55" y="180">speed = exposure length ÷ time</text><rect class="g" x="55" y="215" width="240" height="38" rx="8"/><text class="s" x="80" y="240">Estimated speed and time</text></g>
<g transform="translate(815 70)"><rect class="p" width="350" height="270" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">3</text><text class="h" x="65" y="38">Measure and validate</text><text class="s" x="55" y="100">Place UV-C radiometer at plant</text><text class="s" x="55" y="135">Measure each group and position</text><text class="s" x="55" y="170">Replace estimate with measured I</text><text class="s" x="55" y="205">Run a controlled plant trial</text><text class="s" x="55" y="240">Approve speed in site SOP</text></g></svg>
