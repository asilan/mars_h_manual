  <title
     id="title">Charge the two robot battery packs through their locked side compartments</title>
  <desc
     id="desc">Eight illustrated steps show the left and right battery compartments, making the robot safe, unlocking and opening one compartment, inspecting the battery and charger, connecting the charger to the battery charge port, monitoring charging, disconnecting, and closing and locking the compartment before repeating on the other side.</desc>
