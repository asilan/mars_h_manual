<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t"><title id="t">Eight-step UVC bulb replacement guide</title><rect width="1200" height="720" rx="28" fill="#f3f6f8"/><style>.p{fill:#fff;stroke:#24577a;stroke-width:3}.n{fill:#e87318}.nt{font:700 22px Arial;fill:#fff}.h{font:700 18px Arial;fill:#153247}.s{font:15px Arial;fill:#405665}.lamp{fill:#d7f3ff;stroke:#24577a;stroke-width:3}.d{stroke:#c92127;stroke-width:6}.g{fill:#e5f5eb;stroke:#268653;stroke-width:2}</style><text class="h" x="45" y="40">Philips TUV PL-L 55W/4P HF — lockout and replacement steps</text>
<g transform="translate(30 65)"><rect class="p" width="270" height="280" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">1</text><text class="h" x="58" y="35">All Off + Disarm</text><rect x="55" y="90" width="75" height="55" rx="8" fill="#ffe1df" stroke="#c92127" stroke-width="3"/><text class="s" x="66" y="122">ALL OFF</text><rect class="g" x="145" y="90" width="80" height="55" rx="8"/><text class="s" x="154" y="122">DISARM</text><text class="s" x="50" y="205">Verify both relay groups</text><text class="s" x="70" y="235">and all 4 lamps OFF</text></g>
<g transform="translate(320 65)"><rect class="p" width="270" height="280" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">2</text><text class="h" x="58" y="35">Disconnect and lock out</text><rect x="70" y="85" width="130" height="85" rx="8" fill="#eef3f6" stroke="#24577a" stroke-width="3"/><path d="M110 85v-25q25-30 50 0v25" fill="none" stroke="#24577a" stroke-width="7"/><text class="s" x="103" y="132">LOCK</text><text class="s" x="75" y="210">Isolate UVC electrical supply</text><text class="s" x="85" y="240">Prove de-energized</text></g>
<g transform="translate(610 65)"><rect class="p" width="270" height="280" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">3</text><text class="h" x="58" y="35">Cool and wear PPE</text><path d="M85 170q45-55 90 0v45H85z" fill="#9dd8ee" stroke="#24577a" stroke-width="3"/><path d="M75 220h110" stroke="#24577a" stroke-width="12"/><text class="s" x="55" y="250">UV-rated eye protection</text><text class="s" x="85" y="275">+ clean gloves</text></g>
<g transform="translate(900 65)"><rect class="p" width="270" height="280" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">4</text><text class="h" x="58" y="35">Open guarded fixture</text><rect x="55" y="80" width="160" height="150" rx="8" fill="#eef3f6" stroke="#24577a" stroke-width="3"/><path d="M55 80l160 150m0-150L55 230" stroke="#8097a5" stroke-width="3"/><text class="s" x="55" y="265">Support cover; note orientation</text></g>
<g transform="translate(30 375)"><rect class="p" width="270" height="280" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">5</text><text class="h" x="58" y="35">Remove by the base</text><g transform="translate(55 100)"><rect class="lamp" width="145" height="38" rx="17"/><path d="M18 0v38m109-38v38" stroke="#24577a" stroke-width="3"/><rect x="145" y="4" width="35" height="30" fill="#ddd" stroke="#24577a" stroke-width="3"/><path d="M180 9h25m-25 7h25m-25 7h25m-25 7h25" stroke="#24577a" stroke-width="3"/></g><path d="M160 170v55m0 0-16-20m16 20 16-20" fill="none" stroke="#e87318" stroke-width="5"/><text class="s" x="52" y="260">Pull straight; never twist tubes</text></g>
<g transform="translate(320 375)"><rect class="p" width="270" height="280" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">6</text><text class="h" x="58" y="35">Inspect and match lamp</text><text class="s" x="55" y="95">TUV PL-L 55W/4P HF</text><text class="s" x="55" y="125">2G11 · 4 pins · clear</text><text class="s" x="55" y="155">No cracks · pins straight</text><rect class="g" x="55" y="195" width="160" height="45" rx="8"/><text class="s" x="82" y="223">EXACT MATCH</text></g>
<g transform="translate(610 375)"><rect class="p" width="270" height="280" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">7</text><text class="h" x="58" y="35">Seat base and close</text><g transform="translate(55 105)"><rect class="lamp" width="145" height="38" rx="17"/><rect x="145" y="4" width="35" height="30" fill="#ddd" stroke="#24577a" stroke-width="3"/><path d="M180 9h25m-25 7h25m-25 7h25m-25 7h25" stroke="#24577a" stroke-width="3"/></g><path d="M160 185v-35m0 0-16 20m16-20 16 20" fill="none" stroke="#268653" stroke-width="5"/><text class="s" x="50" y="240">Align 4 pins; press base evenly</text><text class="s" x="65" y="268">Refit guard and seals</text></g>
<g transform="translate(900 375)"><rect class="p" width="270" height="280" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">8</text><text class="h" x="58" y="35">Test group safely</text><circle class="g" cx="90" cy="135" r="28"/><circle class="g" cx="175" cy="135" r="28"/><text class="s" x="63" y="195">Group pair operates</text><text class="s" x="58" y="225">No flicker · guard closed</text><text class="s" x="55" y="255">Log hours and location</text></g></svg>
