  <title
     id="title">RC controller MAVLink 2 data flow</title>
  <desc
     id="desc">Both remote controllers put one MAVLink 2 frame in each RC LoRa packet. The robot receives motion, mode, heartbeat, and optional GPS and UVC commands, then replies with robot status and telemetry.</desc>
