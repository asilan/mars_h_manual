<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 990" role="img" aria-labelledby="t d">
<title id="t">Dual Joystick Remote Controller display pages</title><desc id="d">Nine page overview matching the Dual Joystick Remote Controller firmware.</desc>
<rect width="1260" height="990" fill="#e9eef1"/><defs><style>.s{fill:#fff;stroke:#111;stroke-width:3}.h{fill:#111}.ht{fill:#fff;font:700 22px Arial}.t{fill:#111;font:17px Arial}.b{fill:#111;font:700 18px Arial}.f{fill:#111;font:14px Arial}.card{fill:none;stroke:#111;stroke-width:2}</style></defs>
<!-- Reusable panels are 380 x 285, scaled representation of the 400 x 300 screen. -->
<g transform="translate(30 30)"><rect class="s" width="380" height="285"/><rect class="h" width="380" height="36"/><text class="ht" x="12" y="25">HOME</text><text class="ht" x="179" y="24" font-size="15">ONLINE  ▂▄▆█  ▰86%</text><rect class="card" x="8" y="45" width="190" height="150" rx="5"/><text class="b" x="18" y="67">J1 LEFT    J2 RIGHT</text><circle class="card" cx="60" cy="120" r="31"/><circle class="card" cx="145" cy="120" r="31"/><circle cx="60" cy="120" r="4"/><circle cx="145" cy="120" r="4"/><text class="f" x="18" y="170">SPEED +0.000 m/s</text><text class="f" x="18" y="188">TURN +0.000 rad/s</text><rect class="card" x="206" y="45" width="166" height="150" rx="5"/><text class="b" x="216" y="67">ROBOT</text><text class="f" x="216" y="92">MODE</text><text class="b" x="216" y="114">HOLD</text><text class="f" x="290" y="92">STATUS</text><text class="b" x="300" y="114">OK</text><text class="f" x="216" y="141">V +0.000 W +0.000</text><text class="f" x="216" y="163">BAT 82%  UVC DISARM</text><rect class="card" x="8" y="203" width="364" height="50" rx="5"/><text class="t" x="18" y="234">⌂ 23.4 C  46%RH            ◷ 14:32</text><text class="f" x="8" y="276">SW1: prev  SW2: next  SW3: select  SW4: back</text></g>
<g transform="translate(440 30)"><rect class="s" width="380" height="285"/><rect class="h" width="380" height="36"/><text class="ht" x="12" y="25">ROBOT DETAIL</text><rect class="card" x="8" y="45" width="176" height="90" rx="5"/><text class="b" x="18" y="67">LINK &amp; STATUS</text><text class="t" x="18" y="94">ONLINE  -67 dBm</text><text class="f" x="18" y="117">AGE 0.1s  FLAGS 0x01</text><rect class="card" x="196" y="45" width="176" height="90" rx="5"/><text class="b" x="206" y="67">MODE &amp; MOTION</text><text class="f" x="206" y="91">C MODE HOLD / R HOLD</text><text class="f" x="206" y="112">CMD 0/0  ACT 0/0</text><rect class="card" x="8" y="145" width="176" height="108" rx="5"/><text class="b" x="18" y="168">BATTERY &amp; UVC</text><text class="t" x="18" y="200">BATTERY 82%</text><text class="t" x="18" y="225">UVC DISARM / OFF</text><rect class="card" x="196" y="145" width="176" height="108" rx="5"/><text class="b" x="206" y="168">ROBOT POSITION</text><text class="f" x="206" y="197">29.643210</text><text class="f" x="206" y="217">-82.354110</text><text class="f" x="206" y="237">ALT 31.4m</text><text class="f" x="8" y="276">SW1: prev  SW2: next  SW3: select  SW4: back</text></g>
<g transform="translate(850 30)"><rect class="s" width="380" height="285"/><rect class="h" width="380" height="36"/><text class="ht" x="12" y="25">GPS DETAIL</text><rect class="card" x="8" y="45" width="176" height="90" rx="5"/><text class="b" x="18" y="67">POSITION SOLUTION</text><text class="b" x="18" y="98">RTK FIXED</text><text class="t" x="18" y="122">18 satellites</text><rect class="card" x="196" y="45" width="176" height="90" rx="5"/><text class="b" x="206" y="67">ACCURACY</text><text class="t" x="206" y="98">H 0.014 m</text><text class="t" x="206" y="121">V 0.025 m</text><rect class="card" x="8" y="145" width="176" height="108" rx="5"/><text class="b" x="18" y="168">RTK RADIO</text><text class="t" x="18" y="200">CORRECTIONS OK</text><text class="f" x="18" y="225">RTCM age 0.2s</text><rect class="card" x="196" y="145" width="176" height="108" rx="5"/><text class="b" x="206" y="168">CONTROLLER SENSORS</text><text class="t" x="206" y="200">RTC OK</text><text class="t" x="206" y="225">SHTC3 OK</text><text class="f" x="8" y="276">SW1: prev  SW2: next  SW3: select  SW4: back</text></g>
<g transform="translate(30 350)"><rect class="s" width="380" height="285"/><rect class="h" width="380" height="36"/><text class="ht" x="12" y="25">SETTINGS</text><g class="card"><rect x="12" y="48" width="356" height="36"/><rect x="12" y="89" width="356" height="36"/><rect x="12" y="130" width="356" height="36"/><rect x="12" y="171" width="356" height="36"/><rect x="12" y="212" width="356" height="36"/></g><g class="t"><text x="22" y="72">JOYSTICK CALIBRATION   Center and endpoints</text><text x="22" y="113">JOYSTICK MAPPING       Drive stick and axes</text><text x="22" y="154">BUTTON MAPPING         Assign SW5-SW10</text><text x="22" y="195">LORA SETTINGS          RTK / RC</text><text x="22" y="236">VOICE VOLUME                         80%</text></g><text class="f" x="8" y="276">SW1/2: item  SW3: select  SW4: back</text></g>
<g transform="translate(440 350)"><rect class="s" width="380" height="285"/><rect class="h" width="380" height="36"/><text class="ht" x="12" y="25">JOYSTICK CALIBRATION</text><text class="b" x="24" y="77">Move every stick to all endpoints</text><g class="t"><text x="24" y="115">Throttle    +32767</text><text x="24" y="145">Steering    -32768</text><text x="24" y="175">Aux X       +32767</text><text x="24" y="205">Aux Y       -32768</text></g><text class="f" x="24" y="239">Return both sticks to center before saving.</text><text class="f" x="8" y="276">SW3: save                         SW4: cancel</text></g>
<g transform="translate(850 350)"><rect class="s" width="380" height="285"/><rect class="h" width="380" height="36"/><text class="ht" x="12" y="25">JOYSTICK MAPPING</text><g class="t"><text x="24" y="67">▶ Drive stick                 J2</text><text x="24" y="92">  Reverse drive X             YES</text><text x="24" y="117">  Reverse drive Y             NO</text><text x="24" y="142">  Reverse auxiliary X         YES</text><text x="24" y="167">  J1 X / Y trim                0 / 0</text><text x="24" y="192">  J2 X / Y trim                0 / 0</text><text x="24" y="217">  J1 / J2 deadband             8% / 8%</text></g><text class="f" x="8" y="276">SW1/2: item  SW3: change  SW4: settings</text></g>
<g transform="translate(30 670)"><rect class="s" width="380" height="285"/><rect class="h" width="380" height="36"/><text class="ht" x="12" y="25">BUTTON MAPPING</text><text class="b" x="24" y="67">SW1-SW4  FIXED NAVIGATION</text><g class="t"><text x="24" y="100">▶ SW5    MANUAL / HOLD</text><text x="24" y="126">  SW6    AUTO / PAUSE</text><text x="24" y="152">  SW7    NONE</text><text x="24" y="178">  SW8    NONE</text><text x="24" y="204">  SW9    HIGH SPEED</text><text x="24" y="230">  SW10   NONE</text></g><text class="f" x="8" y="276">SW1/2: item  SW3: change  SW4: settings</text></g>
<g transform="translate(440 670)"><rect class="s" width="380" height="285"/><rect class="h" width="380" height="36"/><text class="ht" x="12" y="25">LORA SETTINGS · LINKS MUST DIFFER</text><rect class="card" x="8" y="47" width="176" height="163" rx="5"/><text class="b" x="18" y="70">RTK RADIO</text><text class="t" x="18" y="105">▶ 903 MHz</text><text class="t" x="18" y="137">  BASE MATCH</text><text class="t" x="18" y="169">  EXAMPLE</text><rect class="card" x="196" y="47" width="176" height="163" rx="5"/><text class="b" x="206" y="70">RC RADIO</text><text class="t" x="206" y="105">  915 MHz</text><text class="t" x="206" y="137">  ROBOT MATCH</text><text class="t" x="206" y="169">  EXAMPLE</text><rect class="card" x="8" y="218" width="364" height="35"/><text class="b" x="72" y="242">VERIFY PLAN · SAVE &amp; APPLY</text><text class="f" x="8" y="276">Never set RTK equal to RC · values shown are examples</text></g>
<g transform="translate(850 670)"><rect class="s" width="380" height="285"/><rect class="h" width="380" height="36"/><text class="ht" x="12" y="25">VOICE VOLUME</text><rect class="card" x="55" y="70" width="270" height="125" rx="8"/><text class="b" x="130" y="105">ALERT SPEAKER</text><text x="151" y="164" font-family="Arial" font-size="44" font-weight="700">80%</text><text class="t" x="70" y="224">SW1 louder        SW2 quieter</text><text class="f" x="8" y="276">SW1: louder  SW2: quieter  SW4: settings</text></g>
</svg>
