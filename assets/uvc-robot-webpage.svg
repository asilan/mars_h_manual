<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d">
<title id="t">UVC robot controller Wi-Fi dashboard</title><desc id="d">Rendered phone-friendly view of the 2WD 2WS robot controller monitoring, relay control, and configuration webpage.</desc>
