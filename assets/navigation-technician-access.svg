     id="style1">
    .card{fill:#fff;stroke:#9aadb9;stroke-width:3}.num{fill:#17618f}.nt{fill:#fff;font:700 23px Arial}.head{fill:#16384d;font:700 21px Arial}.txt{fill:#344e5e;font:17px Arial}.code{fill:#102b3a;font:700 16px Consolas,monospace}.line{fill:none;stroke:#17618f;stroke-width:5;marker-end:url(#arrow)}.warn{fill:#fff2d6;stroke:#e7801d;stroke-width:3}
  </style>
