<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Dual Joystick Remote Controller three-antenna locations</title><desc id="d">Front view of the Dual Joystick Remote Controller showing the left RTK correction LoRa antenna, middle GNSS antenna, and right robot communication LoRa antenna.</desc>
<rect width="1200" height="620" rx="28" fill="#f3f6f8"/><style>.h{font:700 28px Arial;fill:#153247}.s{font:19px Arial;fill:#405665}.b{fill:#fff;stroke:#24577a;stroke-width:4}.a{fill:#dce8ef;stroke:#24577a;stroke-width:4}.r{fill:#fff0d9;stroke:#e87318;stroke-width:4}.g{fill:#e5f5eb;stroke:#268653;stroke-width:4}.line{stroke:#24577a;stroke-width:5;fill:none}</style>
<text class="h" x="45" y="48">Dual Joystick Remote Controller — antenna positions when facing the controller</text>
<g transform="translate(75 92)"><rect class="r" width="300" height="155" rx="18"/><text class="h" x="25" y="43">LEFT</text><text class="h" x="25" y="79">RTK LoRa</text><text class="s" x="25" y="112">Receives corrections</text><text class="s" x="25" y="139">Must match RTK base</text></g>
<g transform="translate(450 92)"><rect class="g" width="300" height="155" rx="18"/><text class="h" x="25" y="43">MIDDLE</text><text class="h" x="25" y="79">GNSS antenna</text><text class="s" x="25" y="112">Local GNSS reception</text><text class="s" x="25" y="139">Not a LoRa antenna</text></g>
<g transform="translate(825 92)"><rect class="a" width="300" height="155" rx="18"/><text class="h" x="25" y="43">RIGHT</text><text class="h" x="25" y="79">Robot LoRa</text><text class="s" x="25" y="112">Commands + telemetry</text><text class="s" x="25" y="139">Must match robot RC</text></g>
<g transform="translate(230 330)"><rect class="b" width="740" height="220" rx="24"/><rect x="250" y="50" width="240" height="110" rx="12" fill="#162b38"/><text x="292" y="112" font-family="Arial" font-size="25" font-weight="700" fill="#d5ffc9">HOLD · ONLINE</text><circle cx="145" cy="135" r="45" fill="#e5edf2" stroke="#24577a" stroke-width="4"/><circle cx="595" cy="135" r="45" fill="#e5edf2" stroke="#24577a" stroke-width="4"/>
<path class="line" d="M85 0V-72M370 0V-72M655 0V-72"/><circle cx="85" cy="-78" r="13" fill="#e87318"/><circle cx="370" cy="-78" r="13" fill="#268653"/><circle cx="655" cy="-78" r="13" fill="#24577a"/>
<text class="s" x="45" y="205">J1</text><text class="s" x="640" y="205">J2</text></g>
<rect x="120" y="575" width="960" height="34" rx="8" fill="#ffe1df"/><text x="151" y="599" font-family="Arial" font-size="19" font-weight="700" fill="#9d1b1f">KEEP RTK AND RC ON DIFFERENT FIELD-APPROVED RADIO SETTINGS TO PREVENT INTERFERENCE</text>
</svg>
