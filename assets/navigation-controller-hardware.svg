  <title
     id="title">Navigation controller and external robot connections</title>
  <desc
     id="desc">The navigation controller includes its Pi camera, Raspberry Pi 5, PoE module, and CAN interface. It connects to the robot PoE switch and to a 5 volt CAN port on the power hub.</desc>
