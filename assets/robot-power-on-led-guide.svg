  <title
     id="title">Robot power-on sequence and power-hub LED indications</title>
  <desc
     id="desc">Seven numbered startup stages show Hold and clear area, four-second precharge, motor contactor click, five-second safety wait, CAN node checks, steering homing, and ready state. A color key explains the power-hub LED.</desc>
  <defs
     id="defs1">
    <marker
       style="overflow:visible"
       id="Triangle"
       refX="0"
       refY="0"
       orient="auto-start-reverse"
       inkscape:stockid="Triangle arrow"
       markerWidth="1"
       markerHeight="1"
       viewBox="0 0 1 1"
       inkscape:isstock="true"
       inkscape:collect="always"
       preserveAspectRatio="xMidYMid">
      <path
         transform="scale(0.5)"
         style="fill:context-stroke;fill-rule:evenodd;stroke:context-stroke;stroke-width:1pt"
         d="M 5.77,0 -2.88,5 V -5 Z"
         id="path135" />
    </marker>
    <style
       id="style1">.bg{fill:#eef3f6}.box{fill:#fff;stroke:#567487;stroke-width:3}.head{font:700 30px Arial;fill:#17384d}.step{font:700 23px Arial;fill:#17384d}.txt{font:18px Arial;fill:#405967}.small{font:16px Arial;fill:#405967}.num{fill:#e87318}.n{font:700 20px Arial;fill:#fff}.arrow{stroke:#24577a;stroke-width:5;fill:none}.sw{stroke:#567487;stroke-width:2}</style>
