<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">Dual Joystick Remote Controller RLCD home screen</title><desc id="d">Rendered example of the 400 by 300 monochrome dashboard.</desc>
