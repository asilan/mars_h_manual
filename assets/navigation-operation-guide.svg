<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t"><title id="t">Automatic navigation illustrated operation guide</title><rect width="1200" height="680" rx="28" fill="#f3f6f8"/><style>.p{fill:#fff;stroke:#24577a;stroke-width:3}.n{fill:#ec7a20}.nt{font:700 23px Arial;fill:#fff}.h{font:700 19px Arial;fill:#153247}.s{font:15px Arial;fill:#405665}.g{fill:#e3f4e9;stroke:#268653;stroke-width:2}.d{fill:#ffe1df;stroke:#d9272e;stroke-width:2}</style><text class="h" x="45" y="40">Navigation controller — numbered automatic-mission guide</text>
<g transform="translate(30 65)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">1</text><text class="h" x="58" y="35">Inspect controller</text><rect x="55" y="85" width="160" height="105" rx="10" fill="#62a96b" stroke="#24577a" stroke-width="3"/><circle cx="165" cy="125" r="30" fill="#182a34"/><circle cx="165" cy="125" r="13" fill="#7bd3ff"/><text class="s" x="55" y="225">PoE · cooling · CSI · lens</text></g>
<g transform="translate(320 65)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">2</text><text class="h" x="58" y="35">Start services</text><rect x="45" y="75" width="180" height="125" rx="8" fill="#13242e"/><text x="60" y="105" font="14px monospace" fill="#9fffb5">camera.service</text><text x="60" y="133" font="14px monospace" fill="#9fffb5">ACTIVE</text><text x="60" y="161" font="14px monospace" fill="#9fffb5">CAN ONLINE</text><text x="60" y="189" font="14px monospace" fill="#9fffb5">VIDEO READY</text><text class="s" x="55" y="230">Keep robot in Hold</text></g>
<g transform="translate(610 65)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">3</text><text class="h" x="58" y="35">Open web console</text><rect x="45" y="75" width="180" height="125" rx="8" fill="#eef3f6" stroke="#24577a" stroke-width="3"/><rect x="60" y="92" width="70" height="55" fill="#a9dbf4"/><path d="M145 115h55m-55 25h45m-130 30h140" stroke="#24577a" stroke-width="4"/><text class="s" x="55" y="230">Map + GPS + video + status</text></g>
<g transform="translate(900 65)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">4</text><text class="h" x="58" y="35">Draw safe boundary</text><rect x="45" y="70" width="180" height="145" fill="#dcefd4" stroke="#24577a" stroke-width="3"/><path d="M75 180 90 95 195 110 205 185Z" fill="none" stroke="#d9272e" stroke-width="5"/><g fill="#d9272e"><circle cx="75" cy="180" r="6"/><circle cx="90" cy="95" r="6"/><circle cx="195" cy="110" r="6"/><circle cx="205" cy="185" r="6"/></g><text class="s" x="55" y="240">At least 3 boundary points</text></g>
<g transform="translate(30 355)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">5</text><text class="h" x="58" y="35">Add and review route</text><rect x="45" y="70" width="180" height="145" fill="#dcefd4" stroke="#24577a" stroke-width="3"/><path d="M70 180 70 100 105 100 105 180 140 180 140 100 180 100 180 180" fill="none" stroke="#24577a" stroke-width="5"/><g fill="#ec7a20"><circle cx="70" cy="180" r="6"/><circle cx="105" cy="100" r="6"/><circle cx="140" cy="180" r="6"/><circle cx="180" cy="100" r="6"/></g><text class="s" x="55" y="240">Check rows · turns · speed</text></g>
<g transform="translate(320 355)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">6</text><text class="h" x="58" y="35">Upload and verify</text><rect class="g" x="55" y="80" width="160" height="55" rx="9"/><text class="h" x="102" y="114">UPLOAD</text><path d="M135 145v40m0-40-15 18m15-18 15 18" fill="none" stroke="#24577a" stroke-width="5"/><text class="s" x="55" y="220">Robot must be inside geofence</text></g>
<g transform="translate(610 355)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">7</text><text class="h" x="58" y="35">Start and supervise</text><rect class="g" x="45" y="75" width="80" height="55" rx="8"/><text class="h" x="63" y="109">AUTO</text><rect x="145" y="75" width="80" height="55" rx="8" fill="#eef3f6" stroke="#24577a" stroke-width="2"/><text class="h" x="160" y="109">START</text><text class="s" x="50" y="180">Watch robot + map + RTK</text><text class="s" x="50" y="210">Operator remains at E-stop</text></g>
<g transform="translate(900 355)"><rect class="p" width="270" height="260" rx="16"/><circle class="n" cx="28" cy="28" r="21"/><text class="nt" x="21" y="36">8</text><text class="h" x="58" y="35">Pause or finish</text><rect class="d" x="45" y="80" width="80" height="55" rx="8"/><text class="h" x="58" y="114">PAUSE</text><rect class="g" x="145" y="80" width="80" height="55" rx="8"/><text class="h" x="162" y="114">HOLD</text><text class="s" x="48" y="185">Correct fault before Resume</text><text class="s" x="48" y="215">Save logs · clean shutdown</text></g></svg>
