<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">CANopen object dictionary map for the MARS robot</title>
<desc id="desc">A 500 kilobit per second CAN bus connects robot master, robot slave, motor drives, GNSS rover, UVC relay, indicator power hub, and the navigation SocketCAN bridge. The remote GNSS base uses the same bit rate only when connected to CAN.</desc>
<defs><style>.bg{fill:#eef3f6}.bus{stroke:#9a6500;stroke-width:14}.box{fill:#fff;stroke:#567487;stroke-width:3}.safe{fill:#e6f5eb;stroke:#268653;stroke-width:3}.uv{fill:#fff2da;stroke:#df741a;stroke-width:3}.head{font:700 28px Arial;fill:#17384d}.txt{font:19px Arial;fill:#405967}.small{font:16px Arial;fill:#405967}.label{font:700 20px Arial;fill:#713f00}</style></defs>
<rect class="bg" width="1500" height="900" rx="28"/><text class="head" x="45" y="55">MARS ROBOT CANopen MAP</text><text class="label" x="1010" y="54">Installed bus: 500 kbit/s</text>
<path class="bus" d="M110 425H1390"/><text class="label" x="565" y="405">CANH · CANL · common GND</text>
<g transform="translate(55 105)"><rect class="box" width="320" height="225" rx="18"/><text class="head" x="20" y="42">Robot master</text><text class="txt" x="20" y="78">Node 11 · 0x0B</text><text class="txt" x="20" y="115">App OD: 0x2000–0x2031</text><text class="txt" x="20" y="150">RPDO 0x1400–0x140C</text><text class="txt" x="20" y="183">TPDO 0x1800–0x1805</text><text class="small" x="20" y="210">SDO server + client</text></g><path class="bus" d="M215 330V425"/>
<g transform="translate(410 105)"><rect class="box" width="320" height="225" rx="18"/><text class="head" x="20" y="42">Robot slave</text><text class="txt" x="20" y="78">Node 10 · 0x0A</text><text class="txt" x="20" y="115">App OD: 0x2000–0x2024</text><text class="txt" x="20" y="150">TPDO 0x1800</text><text class="txt" x="20" y="183">Map 0x1A00: battery</text><text class="small" x="20" y="210">SDO server + client</text></g><path class="bus" d="M570 330V425"/>
<g transform="translate(765 105)"><rect class="box" width="320" height="225" rx="18"/><text class="head" x="20" y="42">Motor drives</text><text class="txt" x="20" y="78">Nodes 1, 2, 3, 4</text><text class="txt" x="20" y="115">CiA 402: 0x6040–0x60FF</text><text class="txt" x="20" y="150">PDO comm: 0x1400/0x1800</text><text class="small" x="20" y="185">1–2 steering · 3–4 drive</text><text class="small" x="20" y="210">0x2403 is vendor-specific</text></g><path class="bus" d="M925 330V425"/>
<g transform="translate(1120 105)"><rect class="safe" width="325" height="225" rx="18"/><text class="head" x="20" y="42">Navigation bridge</text><text class="txt" x="20" y="78">No CANopen node ID</text><text class="txt" x="20" y="115">SocketCAN client on can0</text><text class="txt" x="20" y="150">Writes 0x201B/0x201C</text><text class="txt" x="20" y="183">Targets node 11</text><text class="small" x="20" y="210">Not an object-dictionary device</text></g><path class="bus" d="M1280 330V425"/>
<g transform="translate(55 515)"><rect class="box" width="320" height="225" rx="18"/><text class="head" x="20" y="42">GNSS rover</text><text class="txt" x="20" y="78">Node 20 · 0x14</text><text class="txt" x="20" y="115">5 V power + CAN from hub</text><text class="txt" x="20" y="150">TPDO 0x1800–0x1805</text><text class="small" x="20" y="185">Position, heading, accuracy</text><text class="small" x="20" y="210">mars_gnss_rover.local</text></g><path class="bus" d="M215 425V515"/>
<g transform="translate(410 515)"><rect class="uv" width="320" height="225" rx="18"/><text class="head" x="20" y="42">UVC relay</text><text class="txt" x="20" y="78">Node 15 · 0x0F</text><text class="txt" x="20" y="115">App OD: 0x2000–0x2005</text><text class="txt" x="20" y="150">Six channels + status</text><text class="small" x="20" y="185">Arm value 0xAA</text><text class="small" x="20" y="210">Robot controls it by SDO</text></g><path class="bus" d="M570 425V515"/>
<g transform="translate(765 515)"><rect class="box" width="320" height="225" rx="18"/><text class="head" x="20" y="42">Power hub + LED</text><text class="txt" x="20" y="78">Node 14 · 0x0E</text><text class="txt" x="20" y="115">App OD: 0x2000–0x2004</text><text class="txt" x="20" y="150">RGBA + operating mode</text><text class="small" x="20" y="185">Connects robot sides</text><text class="small" x="20" y="210">Robot controls it by SDO</text></g><path class="bus" d="M925 425V515"/>
<g transform="translate(1120 515)"><rect class="box" width="325" height="225" rx="18"/><text class="head" x="20" y="42">GNSS base</text><text class="txt" x="20" y="78">Default node 21 · 0x15</text><text class="txt" x="20" y="115">App OD: 0x2000–0x2015</text><text class="txt" x="20" y="150">TPDO 0x1800–0x1807</text><text class="small" x="20" y="185">Normally remote from robot</text><text class="small" x="20" y="210">500 kbit/s if CAN-connected</text></g><path class="bus" d="M1280 425V515"/>
<text class="txt" x="55" y="825">All CANopenNode devices also implement communication/service objects in 0x1000–0x1FFF. Use the installed EDS/XDD and live values for commissioning.</text>
</svg>
