    <text x="57" y="349" font-size="20">SPEED +0.000 m/s</text><text x="57" y="381" font-size="20">TURN  +0.000 rad/s</text>
    <rect x="431" y="111" width="328" height="292" rx="12" fill="none" stroke="#111" stroke-width="4"/><text x="448" y="145" font-size="23" font-weight="700">ROBOT</text><text x="448" y="182" font-size="19">MODE</text><text x="448" y="218" font-size="31" font-weight="700">HOLD</text><text x="614" y="182" font-size="19">STATUS</text><text x="614" y="218" font-size="25" font-weight="700">OK</text><text x="448" y="261" font-size="21">V +0.000  W +0.000</text><text x="448" y="305" font-size="21">BAT 82%</text><text x="448" y="354" font-size="20">UVC DISARM</text><text x="625" y="354" font-size="18">SW2: details</text>
