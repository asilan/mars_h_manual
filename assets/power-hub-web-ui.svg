<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
<title id="title">Power hub LED webpage</title><desc id="desc">Illustration of the actual power hub webpage panels: robot status modes, telegraph Morse message, manual red green blue white sliders, all off, and CAN settings.</desc>
<defs><style>.bg{fill:#eef3f6}.panel{fill:#fff;stroke:#ccd9e1;stroke-width:3}.head{font:700 31px Arial;fill:#17384d}.sub{font:700 18px Arial;fill:#506878}.txt{font:18px Arial;fill:#17384d}.btn{fill:#f4f7f9;stroke:#8aa1af;stroke-width:2}.active{fill:#e6f5eb;stroke:#268653;stroke-width:4}.field{fill:#fff;stroke:#8aa1af;stroke-width:2}.danger{fill:#c92127}.white{fill:#fff}.slider{stroke:#d2dce2;stroke-width:12;stroke-linecap:round}.knob{stroke:#fff;stroke-width:3}</style></defs>
<rect class="bg" width="1400" height="950" rx="28"/><text class="head" x="55" y="58">POWER HUB · RGBA LED CONTROL</text><circle fill="#268653" cx="1280" cy="48" r="10"/><text class="sub" x="1300" y="55">Connected</text>
<g transform="translate(45 90)"><rect class="panel" width="1310" height="235" rx="18"/><text class="sub" x="24" y="38">ROBOT STATUS MODE · OD 0x2004</text>
<g transform="translate(25 65)"><rect class="btn" width="185" height="65" rx="12"/><circle fill="#777" cx="30" cy="32" r="12"/><text class="txt" x="55" y="39">Manual</text></g><g transform="translate(225 65)"><rect class="active" width="185" height="65" rx="12"/><circle fill="#ffd900" cx="30" cy="32" r="12"/><text class="txt" x="55" y="39">Startup</text></g><g transform="translate(425 65)"><rect class="btn" width="185" height="65" rx="12"/><circle fill="#1685ff" cx="30" cy="32" r="12"/><text class="txt" x="55" y="39">Running</text></g><g transform="translate(625 65)"><rect class="btn" width="185" height="65" rx="12"/><circle fill="#ff8200" cx="30" cy="32" r="12"/><text class="txt" x="55" y="39">Error</text></g><g transform="translate(825 65)"><rect class="btn" width="185" height="65" rx="12"/><circle fill="#ff0033" cx="30" cy="32" r="12"/><text class="txt" x="55" y="39">E-stop</text></g><g transform="translate(1025 65)"><rect class="btn" width="185" height="65" rx="12"/><circle fill="#fff" stroke="#777" cx="30" cy="32" r="12"/><text class="txt" x="55" y="39">Night</text></g>
<g transform="translate(325 145)"><rect class="btn" width="250" height="65" rx="12"/><circle fill="#fff" stroke="#777" cx="30" cy="32" r="12"/><text class="txt" x="55" y="39">Telegraph</text></g><g transform="translate(590 145)"><rect class="btn" width="185" height="65" rx="12"/><circle fill="#ffd900" cx="30" cy="32" r="12"/><text class="txt" x="55" y="39">Idle</text></g><g transform="translate(790 145)"><rect class="btn" width="250" height="65" rx="12"/><circle fill="#ff00d4" cx="30" cy="32" r="12"/><text class="txt" x="55" y="39">Link Lost</text></g></g>
<g transform="translate(45 350)"><rect class="panel" width="640" height="240" rx="18"/><text class="sub" x="24" y="38">TELEGRAPH · TYPE TO SEND MORSE</text><rect class="field" x="24" y="65" width="592" height="62" rx="10"/><text class="txt" x="42" y="103" fill="#708795">SERVICE MESSAGE</text><text class="sub" x="24" y="165">White channel repeats the entered text in Morse.</text><text class="sub" x="24" y="198">Typing selects mode 6 automatically.</text></g>
<g transform="translate(715 350)"><rect class="panel" width="640" height="370" rx="18"/><text class="sub" x="24" y="38">MANUAL COLOR · OD 0x2001</text>
<text class="txt" x="25" y="85">Red</text><line class="slider" x1="120" y1="78" x2="570" y2="78"/><circle class="knob" fill="#f44" cx="410" cy="78" r="13"/><text class="txt" x="585" y="85">165</text>
<text class="txt" x="25" y="145">Green</text><line class="slider" x1="120" y1="138" x2="570" y2="138"/><circle class="knob" fill="#2b6" cx="300" cy="138" r="13"/><text class="txt" x="585" y="145">102</text>
<text class="txt" x="25" y="205">Blue</text><line class="slider" x1="120" y1="198" x2="570" y2="198"/><circle class="knob" fill="#1685ff" cx="220" cy="198" r="13"/><text class="txt" x="585" y="205">57</text>
<text class="txt" x="25" y="265">White</text><line class="slider" x1="120" y1="258" x2="570" y2="258"/><circle class="knob" fill="#fff" cx="120" cy="258" r="13"/><text class="txt" x="585" y="265">0</text>
<rect class="danger" x="24" y="298" width="592" height="50" rx="10"/><text class="head white" x="260" y="334" font-size="21">ALL OFF</text></g>
<g transform="translate(45 615)"><rect class="panel" width="640" height="285" rx="18"/><text class="sub" x="24" y="38">CAN BUS SETTINGS</text><text class="txt" x="24" y="85">Bit rate</text><rect class="field" x="180" y="55" width="410" height="52" rx="9"/><text class="txt" x="200" y="88">500 kbit/s</text><text class="txt" x="24" y="150">Node ID</text><rect class="field" x="180" y="120" width="410" height="52" rx="9"/><text class="txt" x="200" y="153">14</text><text class="sub" x="24" y="205">Active rate: 500 kbit/s · Node ID 14</text><rect fill="#24577a" x="24" y="225" width="566" height="45" rx="9"/><text class="head white" x="220" y="257" font-size="20">SAVE &amp; REBOOT</text></g>
</svg>
