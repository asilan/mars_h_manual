<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t"><title id="t">Dual Joystick Remote Controller illustrated steps</title><rect width="1200" height="640" rx="28" fill="#f3f6f8"/><style>.p{fill:#fff;stroke:#24577a;stroke-width:3}.n{fill:#ec7a20}.nt{font:700 24px Arial;fill:#fff}.h{font:700 20px Arial;fill:#153247}.s{font:16px Arial;fill:#405665}.k{fill:#e9eef2;stroke:#24577a;stroke-width:2}.on{fill:#e5f5eb;stroke:#268653;stroke-width:2}</style><text class="h" x="45" y="42">Dual Joystick Remote Controller — numbered operator guide</text>
<g transform="translate(35 70)"><rect class="p" width="355" height="245" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">1</text><text class="h" x="62" y="37">Prepare controls</text><rect x="70" y="70" width="220" height="130" rx="12" fill="#d4dde3" stroke="#24577a" stroke-width="3"/><circle class="k" cx="115" cy="150" r="28"/><circle class="k" cx="245" cy="150" r="28"/><path d="M115 150v-38m130 38v-38" stroke="#24577a" stroke-width="7"/><text class="s" x="62" y="214">Left RTK · Middle GPS · Right RC</text><text class="s" x="92" y="237">J1/J2 centered</text></g>
<g transform="translate(423 70)"><rect class="p" width="355" height="245" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">2</text><text class="h" x="62" y="37">Read Home screen</text><rect x="60" y="70" width="235" height="125" rx="8" fill="#eef3e4" stroke="#24577a" stroke-width="3"/><text class="s" x="85" y="105">ONLINE   RSSI -62</text><text class="s" x="85" y="135">MODE HOLD</text><text class="s" x="85" y="165">CMD 0.0 / 0.0</text><text class="s" x="85" y="188">UVC DISARMED</text></g>
<g transform="translate(811 70)"><rect class="p" width="355" height="245" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">3</text><text class="h" x="62" y="37">Drive with J2</text><circle class="k" cx="115" cy="145" r="45"/><path d="M115 145v-50" stroke="#ec7a20" stroke-width="8"/><rect class="on" x="190" y="105" width="115" height="65" rx="10"/><text class="h" x="208" y="145">SW5</text><text class="s" x="195" y="195">Manual / Hold</text></g>
<g transform="translate(35 345)"><rect class="p" width="355" height="245" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">4</text><text class="h" x="62" y="37">Navigate pages</text><rect class="k" x="65" y="90" width="80" height="55" rx="8"/><text class="h" x="86" y="125">SW1</text><rect class="k" x="170" y="90" width="80" height="55" rx="8"/><text class="h" x="191" y="125">SW2</text><text class="s" x="75" y="180">Previous / Next</text><text class="s" x="75" y="208">SW3 Select · SW4 Back</text></g>
<g transform="translate(423 345)"><rect class="p" width="355" height="245" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">5</text><text class="h" x="62" y="37">Confirm UVC warning</text><rect x="60" y="75" width="235" height="125" rx="8" fill="#ffe4e2" stroke="#d9272e" stroke-width="3"/><text x="105" y="108" font="700 18px Arial" fill="#9b1117">UV-C WARNING</text><text class="s" x="86" y="140">SW3 = TURN ON</text><text class="s" x="86" y="170">SW4 = CANCEL</text><text class="s" x="105" y="225">10-second timeout</text></g>
<g transform="translate(811 345)"><rect class="p" width="355" height="245" rx="18"/><circle class="n" cx="30" cy="30" r="22"/><text class="nt" x="23" y="38">6</text><text class="h" x="62" y="37">Use Wi-Fi setup</text><g fill="none" stroke="#24577a" stroke-width="7" stroke-linecap="round"><path d="M58 112Q115 60 172 112"/><path d="M78 137Q115 103 152 137"/><path d="M98 159Q115 143 132 159"/></g><circle cx="115" cy="174" r="7" fill="#24577a"/><text class="s" x="185" y="100">RC-Controller</text><text class="s" x="185" y="130">rccontroller</text><text class="s" x="185" y="160">192.168.4.1</text><text class="s" x="55" y="220">Keep RC and RTK radio settings separate</text></g></svg>
